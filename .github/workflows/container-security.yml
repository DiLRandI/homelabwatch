name: container-security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "53 1 * * 5"

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build scan image
        run: docker build --tag homelabwatch:scan .

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: homelabwatch:scan
          artifact-name: homelabwatch-image.spdx.json
          format: spdx-json
          syft-version: v1.45.0
          upload-artifact-retention: 7
          upload-release-assets: false

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: homelabwatch:scan
          trivy-version: v0.71.2
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
